name: Build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lean:
    name: Check Lean proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Resolve dependencies and check proofs
        working-directory: lean
        run: |
          lake update
          lake exe cache get
          lake build

  document:
    name: Build proof note
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-xetex texlive-latex-extra texlive-fonts-recommended
      - name: Build PDF
        run: |
          mkdir -p doc/build dist
          cd doc
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -outdir=build main.tex
          cp build/main.pdf ../dist/compact-relational-summaries.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: compact-relational-summaries-pdf
          path: dist/compact-relational-summaries.pdf

  release:
    name: Release PDF
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lean, document]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: compact-relational-summaries-pdf
          path: release
      - name: Create or update v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pdf=release/compact-relational-summaries.pdf
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.1.0 "$pdf" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.1.0 "$pdf" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Compact Relational Summaries v0.1.0" \
              --notes "Initial release of the compact proof note and Lean formalization."
          fi
